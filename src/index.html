<script>
  const codeElement = document.getElementById("code");
  const code = `
// Welcome to Multilla Library
const multilla = require('multilla');

// Example usage
const data = multilla.transform(input);
console.log(data);`;

  let i = 0;
  function typeCode() {
    if (i < code.length) {
      codeElement.innerHTML += code.charAt(i);
      i++;
      setTimeout(typeCode, 100);
    }
  }

  typeCode();
</script>
